[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Explicit package discovery — the CI build workflows drop
# ffmpeg_bin/ and other transient folders alongside the source
# tree before the pip install step, and setuptools' flat-layout
# auto-discovery refuses to build when it sees more than one
# top-level directory. Pinning the pattern to "ficary*" makes
# discovery deterministic regardless of what's in the workspace.
[tool.setuptools.packages.find]
include = ["ficary*"]
namespaces = false

[project]
name = "ficary"
version = "2.20.19"
description = "Cross-platform fanfiction + erotica downloader (FFN, AO3, FicWad, Royal Road, MediaMiner, Wattpad, Webnovel, Literotica, AFF, StoriesOnline, Nifty, SexStories, MCStories, Lushstories, Fictionmania, TGStorytime, Chyoa, Dark Wanderer, GreatFeet, BDSM Library, The Mousepad, ReadOnlyMind, Giantess World, Chastity Mansion, TicklingForum)"
# 3.10 is the real floor: curl_cffi requires it, and the
# codebase uses PEP 604 unions in evaluated annotations.
requires-python = ">=3.10"
dependencies = [
    # 0.11 is the verified floor for curl_cffi.requests.exceptions
    # (ConnectionError/Timeout), which scraper.py imports at module scope.
    "curl_cffi>=0.11",
    "beautifulsoup4>=4.12",
    # lxml 6.0.x carries CVE-2026-41066; 6.1.0 ships the fix.
    "lxml>=6.1.0",
]

[project.optional-dependencies]
epub = ["ebooklib>=0.18"]
# Microsoft's voice service stops accepting older clients from time to
# time: on 2026-11-23 it refused edge-tts 7.2.8 with a 403 and served
# 7.3.1. The floor is the oldest version known to work.
audio = ["edge-tts>=7.3.1"]
gui = ["wxPython>=4.2"]
clipboard = ["pyperclip>=1.8"]
cf-solve = ["playwright>=1.40"]
# Every PyOpenAL release is a pre-release (0.7.11a1 is the newest), and
# pip only picks a pre-release by itself in its newer versions: pip 25.1
# answers "PyOpenAL>=0.7" with "no matching distribution". A requirement
# that names a pre-release is accepted by every pip, so name one.
playback = ["PyOpenAL>=0.7.11a1"]
# prism tells the user's screen reader when a download or update has
# finished. It has no promise of keeping its interface between minor
# versions, so stay on 0.18.
announce = ["prismatoid~=0.18.4"]
# PyYAML: the release-plumbing tests parse the build workflows.
dev = ["pytest>=7.0", "hypothesis>=6.100", "PyYAML>=6.0"]
all = ["ebooklib>=0.18", "edge-tts>=7.3.1", "wxPython>=4.2", "pyperclip>=1.8", "PyOpenAL>=0.7.11a1", "prismatoid~=0.18.4"]

[project.scripts]
ficary = "ficary.entrypoint:main"
