name: Build macOS Binary

# Produces a clickable macOS arm64 ``.app`` bundle for each v-tag
# release. Apple-Silicon only — Intel Mac users install via pip.
# Accessibility: wxPython on macOS wraps native Cocoa widgets, which
# VoiceOver reads the same way it reads any macOS app; CLI users can
# still invoke the binary inside the bundle directly
# (``ficary.app/Contents/MacOS/ficary --url ...``).
#
# The build is unsigned — users hit Gatekeeper on first launch.
# Code-signing + notarization would need a paid Apple Developer
# account; the README documents the right-click → Open workaround.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Refuse to publish an artifact built from a revision whose tests
    # have not passed. Runs against the tagged commit, not whatever
    # happened to be green on a branch earlier.
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    # macos-latest is arm64 (Apple Silicon) as of the mid-2024
    # runner swap. Produces an arm64 binary; Rosetta 2 lets Intel
    # Macs run it but a native Intel build would need macos-13.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Keep in sync with neural_env.PYTHON_EMBED_VERSION (ABI match
          # for optional-feature wheels installed into deps/).
          python-version: "3.12"

      - name: Install ffmpeg and ffprobe
        # Static macOS builds with no runtime dependencies beyond the
        # system libs. Same "bundle it, don't require users to brew
        # install" philosophy the Windows build uses.
        #
        # osxexperts.net rather than evermeet.cx: this build runs on
        # Apple Silicon and Evermeet publishes Intel binaries only
        # ("I do not plan to provide native ffmpeg binaries for Apple
        # Silicon ARM"). An arm64 app bundling an x86_64 helper needs
        # Rosetta 2, which a clean Apple Silicon Mac does not have, so
        # every audiobook render failed there with no useful message.
        #
        # Small single-server host like John Van Sickle's; same retry
        # rationale as build-linux.yml — one transient connection
        # timeout shouldn't fail the release.
        run: |
          set -e
          mkdir -p ffmpeg_bin
          curl -L --fail \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            -o ffmpeg.zip https://www.osxexperts.net/ffmpeg9arm.zip
          curl -L --fail \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            -o ffprobe.zip https://www.osxexperts.net/ffprobe9arm.zip
          unzip -o ffmpeg.zip -d ffmpeg_bin/
          unzip -o ffprobe.zip -d ffmpeg_bin/
          rm -rf ffmpeg_bin/__MACOSX
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe
          ls -la ffmpeg_bin/

      - name: Verify the helpers are native and runnable
        # The whole point of the previous step is a helper this app can
        # execute. Shipping the wrong architecture is invisible until a
        # user tries to build an audiobook, so fail the build here
        # instead: check the Mach-O architecture, then actually run
        # each binary and mux a one-second file end to end.
        run: |
          set -e
          for helper in ffmpeg ffprobe; do
            echo "--- $helper ---"
            file "ffmpeg_bin/$helper"
            lipo -archs "ffmpeg_bin/$helper"
            lipo -archs "ffmpeg_bin/$helper" | grep -qw arm64 || {
              echo "::error::ffmpeg_bin/$helper is not an arm64 binary." \
                   "This build runs on Apple Silicon; a translated" \
                   "helper needs Rosetta 2, which a clean Mac lacks."
              exit 1
            }
            # Ad-hoc sign: a downloaded binary is unsigned and Gatekeeper
            # kills it on first exec. PyInstaller signs what it bundles,
            # but we need to run these right now to prove they work.
            codesign --force --sign - "ffmpeg_bin/$helper"
            "ffmpeg_bin/$helper" -version | head -n 1
          done
          ./ffmpeg_bin/ffmpeg -v error -f lavfi -i "sine=duration=1" \
            -c:a aac -y /tmp/helper-check.m4a
          ./ffmpeg_bin/ffprobe -v error -show_entries format=duration \
            -of csv=p=0 /tmp/helper-check.m4a

      - name: Install Python dependencies
        # wxPython ships macOS wheels on PyPI for both arm64 and
        # x86_64, so the plain install works without the extras
        # URL dance the Linux build needs.
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]"
          pip install pyinstaller

      - name: Build app bundle
        # ``--windowed`` is the macOS-specific flag that wraps the
        # ``--onedir`` output in a proper ``.app`` bundle so Finder
        # treats it as an application: double-clickable, draggable
        # to /Applications, no Terminal window pops up at launch.
        # Without it, PyInstaller produces a bare directory of
        # binaries that CLI users can run but GUI users can't open
        # the normal way.
        #
        # ``--collect-submodules ficary`` scoops up every submodule
        # under the package so new files land in the bundle without
        # maintaining a hidden-import list.
        run: |
          pyinstaller --onedir --name ficary --windowed \
            --add-binary "ffmpeg_bin/ffmpeg:." \
            --add-binary "ffmpeg_bin/ffprobe:." \
            --collect-submodules ficary \
            --add-data "ficary/_cf_worker.py:ficary" \
            --hidden-import edge_tts \
            --hidden-import ebooklib \
            --hidden-import curl_cffi \
            --hidden-import wx \
            --collect-all curl_cffi \
            --collect-all wx \
            ficary/__main__.py

      - name: Smoke-test bundle
        # --windowed builds put the binary inside Contents/MacOS;
        # CLI users will invoke it the same way.
        #
        # ``--help`` only proves argparse loaded. ``--version`` proves
        # the frozen bundle imported the package itself, and running
        # the bundled helpers proves the thing every audiobook render
        # depends on actually executes on this platform.
        run: |
          set -e
          dist/ficary.app/Contents/MacOS/ficary --help
          dist/ficary.app/Contents/MacOS/ficary --version
          find dist/ficary.app -name ffmpeg -type f -exec {} -version \; \
            | head -n 1
          find dist/ficary.app -name ffprobe -type f -exec {} -version \; \
            | head -n 1

      - name: Package
        # ``ditto`` preserves macOS metadata (extended attributes,
        # the executable bit, resource forks) that a plain ``zip``
        # can mangle on .app bundles — without it the unzipped app
        # sometimes refuses to launch with "damaged" errors before
        # Gatekeeper even gets a chance to weigh in.
        run: |
          cd dist
          ditto -c -k --keepParent --sequesterRsrc ficary.app ficary-macos-arm64.zip
          ls -la ficary-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ficary-macos-arm64
          path: dist/ficary-macos-arm64.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ficary-macos-arm64.zip
