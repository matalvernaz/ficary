name: Tests

on:
  push:
    branches: [master, reader]
  pull_request:
    branches: [master, reader]
  workflow_dispatch:
  # Callable so each release build can gate on the tagged revision's
  # tests. A tag used to start three build workflows directly, none of
  # which knew whether the commit it pointed at was green.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install GTK runtime + xvfb (wxPython + headless GUI tests)
        # The GUI smoke tests boot a real wx MainFrame, which needs the
        # GTK3 runtime libs and a virtual display. Without these the whole
        # test_gui_smoke.py module skips (importorskip wx / no DISPLAY) —
        # which is how a NameError that killed every GUI download shipped
        # unnoticed across 2.7.0-2.8.0. Mirrors build-linux.yml's lib set,
        # plus xvfb for the headless display.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libsdl2-2.0-0 \
            libegl1 libgl1 libglu1-mesa \
            libnotify4 libsm6 libxkbcommon0 \
            at-spi2-core xvfb

      - name: Install package with dev deps
        # wxPython has no universal Linux wheel on PyPI (the GTK3 ABI is
        # distro-version-specific); the extras repo hosts per-Ubuntu-version
        # wheels. Same recipe as build-linux.yml.
        #
        # --only-binary is load-bearing. pip picks the highest version
        # across every source, and 4.3.0/4.3.1 shipped to PyPI as an
        # sdist with no Linux wheel anywhere, so pip started preferring
        # them over the newest extras wheel and building wxWidgets from
        # source -- which fails, slowly, on a runner that only has the
        # GTK *runtime* libs. Refusing sdists pins us to the newest real
        # wheel and picks 4.3.x up automatically once extras publishes
        # it. No `|| pip install wxPython` fallback for the same reason:
        # it only ever turned "no wheel" into a doomed source build.
        run: |
          python -m pip install --upgrade pip
          UBUNTU_VERSION=$(lsb_release -rs)
          pip install --only-binary=wxPython -f \
            "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-${UBUNTU_VERSION}" \
            wxPython
          pip install -e ".[dev,epub]"

      - name: Run pytest
        # xvfb-run gives the GUI smoke tests a virtual display; the rest of
        # the suite ignores it.
        run: xvfb-run -a python -m pytest tests/ -v

      - name: Lint for undefined names and syntax errors
        # The suite cannot catch a NameError on a branch it never runs;
        # an unimported ``generate_audiobook`` shipped that way. F/E9 only
        # — this gate is for real defects, not style.
        run: |
          python -m pip install ruff
          ruff check --select F821,F811,E9 ficary/

  python-floor:
    # The declared minimum Python must actually be able to import the
    # application. A PEP 604 annotation in evaluated position made the
    # previously declared floor fail on a real interpreter, and nothing
    # noticed because CI only ever ran the newest version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install without optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[epub]"
      - name: Import and run the CLI
        run: |
          python -c "import ficary.cli, ficary.entrypoint"
          python -m ficary --help
