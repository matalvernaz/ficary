name: Build Linux Binary

# Produces a portable x86_64 Linux binary (ficary folder, tar.gz
# bundled) for each v-tag release. Accessibility: wxPython on
# Linux wraps GTK3 widgets, which Orca (the GNOME screen reader)
# reads natively. The CLI is plain text and works in any
# terminal with any screen reader (Orca, Fenrir, BRLTTY). GTK3
# accessibility bridge (at-spi2) is part of every desktop Linux
# install — the binary doesn't need to bundle it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Keep in sync with neural_env.PYTHON_EMBED_VERSION (ABI match
          # for optional-feature wheels installed into deps/).
          python-version: "3.12"

      - name: Install GTK runtime (wxPython dependency)
        # libgtk-3-0 + the at-spi2 accessibility bridge are the
        # runtime libs wxPython's GTK3 backend needs. Both are
        # preinstalled on ubuntu-latest, but the explicit install
        # pins the surface so a future image rebuild that dropped
        # either one would fail loudly here rather than producing
        # a silently broken GUI binary.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libsdl2-2.0-0 \
            libegl1 libgl1 libglu1-mesa \
            libnotify4 libsm6 libxkbcommon0 \
            at-spi2-core

      - name: Install ffmpeg (static build)
        # Static build, so the bundle works on any desktop Linux
        # without the user apt-get installing ffmpeg separately.
        #
        # Same source as the Windows job. The previous source
        # (johnvansickle.com) is a single small server that had
        # frozen at ffmpeg 7.0.2 / August 2024 and served this job a
        # sustained HTTP 415 on 2026-07-26, taking down the v2.18.0
        # Linux release; it publishes no versioned URL to pin
        # instead, so retry flags were the only available defence.
        #
        # ``master-latest`` rather than an ``nX.Y-latest`` release
        # branch on purpose: a branch build stops being rebuilt once
        # upstream moves on, which is the same silent-staleness trap
        # we just left. Must stay a ``-gpl`` variant — ficary calls
        # libx264, which the lgpl builds omit.
        #
        # GitHub's "/releases/download/latest/..." redirect is
        # occasionally rate-limited or serves a small stub instead of
        # the real tarball, and curl --retry only retries transport
        # errors — so size-check the payload and loop, matching the
        # Windows job.
        run: |
          set -e
          mkdir -p ffmpeg_bin
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for attempt in 1 2 3 4 5; do
            curl -L --fail --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 300 \
              -o ffmpeg.tar.xz "$url" || true
            size=$(wc -c < ffmpeg.tar.xz 2>/dev/null || echo 0)
            echo "Attempt $attempt: ffmpeg.tar.xz is $size bytes"
            if [ "$size" -gt 1000000 ]; then
              break
            fi
            echo "Too small; retrying in 15s..."
            sleep 15
          done
          if [ "$(wc -c < ffmpeg.tar.xz 2>/dev/null || echo 0)" -le 1000000 ]; then
            echo "ffmpeg download never returned a full tarball" >&2
            exit 1
          fi
          tar -xf ffmpeg.tar.xz
          dir=$(find . -maxdepth 1 -type d \
            -name "ffmpeg-master-latest-linux64-gpl" | head -1)
          cp "$dir/bin/ffmpeg" "$dir/bin/ffprobe" ffmpeg_bin/
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe
          ffmpeg_bin/ffmpeg -version | head -1
          ls -la ffmpeg_bin/

      - name: Install Python dependencies
        # wxPython doesn't ship universal Linux wheels on PyPI
        # because the GTK3 ABI is distro-version-specific. The
        # official extras repo at extras.wxpython.org hosts pre-
        # built wheels keyed by Ubuntu version; using -f with that
        # URL adds it as a find-links source so pip picks the
        # right wheel for the runner's Ubuntu version.
        run: |
          python -m pip install --upgrade pip
          UBUNTU_VERSION=$(lsb_release -rs)
          echo "Detected Ubuntu $UBUNTU_VERSION"
          pip install -f \
            "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-${UBUNTU_VERSION}" \
            wxPython || pip install wxPython
          pip install ".[all]"
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onedir --name ficary --console \
            --add-binary "ffmpeg_bin/ffmpeg:." \
            --add-binary "ffmpeg_bin/ffprobe:." \
            --collect-submodules ficary \
            --add-data "ficary/_cf_worker.py:ficary" \
            --hidden-import edge_tts \
            --hidden-import ebooklib \
            --hidden-import curl_cffi \
            --hidden-import wx \
            --collect-all curl_cffi \
            --collect-all wx \
            ficary/__main__.py

      - name: Smoke-test executable
        run: dist/ficary/ficary --help

      - name: Package
        # tar.gz preserves the executable bit so the binary stays
        # runnable after extraction.
        run: |
          cd dist && tar czf ficary-linux-x86_64.tar.gz ficary
          ls -la ficary-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ficary-linux-x86_64
          path: dist/ficary-linux-x86_64.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ficary-linux-x86_64.tar.gz
